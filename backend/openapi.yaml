  /health:
    get:
      servers: [{ url: / }]
      tags: [Health]
      summary: Root health probe
      responses:
        "200": { description: Process is running }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    refreshCookie:
      type: apiKey
      in: cookie
      name: calmwork_refresh
    operationsCookie:
      type: apiKey
      in: cookie
      name: calmwork_operations
  schemas:
    Signup:
      type: object
      additionalProperties: false
      required: [name, email, password]
      properties:
        name: { type: string, minLength: 2, maxLength: 100 }
        email: { type: string, format: email, maxLength: 254, description: Case-sensitive; preserve capitalization when signing in. }
        password: { type: string, minLength: 8, maxLength: 128 }
        organizationName: { type: string, minLength: 2, maxLength: 120 }
    Signin:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, format: email, description: Case-sensitive; use the same capitalization as at signup. }
        password: { type: string, minLength: 8, maxLength: 128 }
    ProfileUpdate:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 2, maxLength: 100 }
        settings:
          type: object
          additionalProperties: false
          properties:
            idleThresholdMinutes: { type: integer, minimum: 1, maximum: 30 }
            notifications:
              type: object
              additionalProperties: false
              properties:
                weeklyPulse: { type: boolean }
                idlePrompt: { type: boolean }
                productUpdates: { type: boolean }
    PulseSubmission:
      type: object
      additionalProperties: false
      required: [mood, stress, workload]
      properties:
        mood: { type: integer, minimum: 1, maximum: 5 }
        stress: { type: integer, minimum: 1, maximum: 5 }
        workload: { type: integer, minimum: 1, maximum: 5 }
        comment: { type: string, maxLength: 300, description: Accepted but discarded and never persisted. }
  responses:
    AccountCreated:
      description: Account created; the user must sign in separately to start a session.
      content:
        application/json:
          schema:
            type: object
            required: [user]
            properties:
              user: { type: object }
    AuthSession:
      description: Session; refresh token is only sent as a Secure/HttpOnly/SameSite cookie.
      headers:
        Set-Cookie:
          schema: { type: string }
      content:
        application/json:
          schema:
            type: object
            properties:
              accessToken: { type: string }
              tokenType: { type: string, example: Bearer }
              user: { type: object }
    BadRequest:
      description: Invalid input
    Unauthorized:
      description: Missing or invalid authentication
    Forbidden:
      description: Forbidden or subscription gate
    NotFound:
      description: Resource not found in the current tenant
    Conflict:
      description: Duplicate resource or weekly submission
    SubscriptionRequired:
      description: An active Team or Business subscription is required
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                properties:
                  code: { type: string, enum: [SUBSCRIPTION_REQUIRED] }
                  message: { type: string }
    ServiceUnavailable:
      description: Dependency unavailable or not configured
