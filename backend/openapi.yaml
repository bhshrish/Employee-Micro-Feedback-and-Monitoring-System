openapi: 3.0.3
info:
  title: CalmWork API
  version: 1.0.0
  description: |
    Multi-tenant API for password authentication and password recovery,
    single-platform-administrator password authentication, privacy-first activity tracking,
    anonymous weekly pulse, team-level wellbeing signals, employee tools, reports,
    and Razorpay subscription billing. JSON responses use success, data, and error
    fields; compatibility properties may also appear at the top level.
    Pulse comments are accepted only for compatibility and are discarded; they are never persisted or returned.
servers:
  - url: /api/v1
tags:
  - name: Health
  - name: Authentication
  - name: Operations
  - name: Attendance
  - name: Workspace
  - name: Activity
  - name: Pulse
  - name: Reports
  - name: Billing
  - name: Employee tools
paths:
  /health/live:
    get:
      servers: [{ url: /api/v1 }, { url: / }]
      tags: [Health]
      summary: Liveness probe
      responses:
        "200": { description: Process is running }
  /health/ready:
    get:
      servers: [{ url: /api/v1 }, { url: / }]
      tags: [Health]
      summary: Readiness probe
      responses:
        "200": { description: MongoDB is available }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /auth/otp/request:
    post:
      tags: [Authentication]
      summary: Request an email or SMS one-time code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [purpose]
              properties:
                channel: { type: string, enum: [email, sms], default: email }
                email: { type: string, format: email }
                phone: { type: string, pattern: "^\\+[1-9][0-9]{7,14}$" }
                purpose: { type: string, enum: [signin, business_signup, invitation] }
                name: { type: string, minLength: 2, maxLength: 100 }
                organizationName: { type: string, minLength: 2, maxLength: 120 }
                invitationToken: { type: string }
      responses:
        "200": { description: Code requested; response does not disclose account existence }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { description: Resend cooldown or rate limit }
  /auth/signup:
    post:
      tags: [Authentication]
      summary: Create a business workspace owner account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, email, password, organizationName]
              properties:
                name: { type: string, minLength: 2, maxLength: 100 }
                email: { type: string, format: email }
                password: { type: string, minLength: 8, maxLength: 128 }
                organizationName: { type: string, minLength: 2, maxLength: 120 }
      responses:
        "201": { description: Workspace owner account created }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { description: Email is already registered }
  /auth/signin:
    post:
      tags: [Authentication]
      summary: Sign in with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 8, maxLength: 128 }
      responses:
        "200": { $ref: "#/components/responses/AuthSession" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /auth/forgot-password:
    post:
      tags: [Authentication]
      summary: Send a password reset link without revealing account existence
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "200": { description: Generic reset request acknowledgement }
        "400": { $ref: "#/components/responses/BadRequest" }
  /auth/reset-password:
    post:
      tags: [Authentication]
      summary: Set a new password with a valid emailed reset token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token, password]
              properties:
                token: { type: string, minLength: 32, maxLength: 128 }
                password: { type: string, minLength: 8, maxLength: 128 }
      responses:
        "200": { description: Password changed; existing sessions are revoked }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /auth/otp/verify:
    post:
      tags: [Authentication]
      summary: Verify a one-time code and establish an HTTP-only cookie session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [purpose, code]
              properties:
                channel: { type: string, enum: [email, sms], default: email }
                email: { type: string, format: email }
                phone: { type: string, pattern: "^\\+[1-9][0-9]{7,14}$" }
                purpose: { type: string, enum: [signin, business_signup, invitation] }
                code: { type: string, pattern: "^[0-9]{6}$" }
                name: { type: string, minLength: 2, maxLength: 100 }
      responses:
        "200": { description: Session established with HTTP-only access and refresh cookies }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /auth/refresh:
    post:
      tags: [Authentication]
      summary: Rotate the HTTP-only refresh cookie
      security: [{ refreshCookie: [] }]
      responses:
        "200": { $ref: "#/components/responses/AuthSession" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /auth/logout:
    post:
      tags: [Authentication]
      summary: Revoke the current refresh token
      security: [{ refreshCookie: [] }]
      responses:
        "204": { description: Session revoked }
  /auth/logout-all:
    post:
      tags: [Authentication]
      summary: Revoke all refresh-token families for the user
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Sessions revoked }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /auth/me:
    get:
      tags: [Authentication]
      summary: Return the current user, workspace role, and subscription
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Current user }
        "401": { $ref: "#/components/responses/Unauthorized" }
    patch:
      tags: [Authentication]
      summary: Update the current user's name and preferences
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProfileUpdate" }
      responses:
        "200": { description: Updated user }
        "400": { $ref: "#/components/responses/BadRequest" }
  /workspace/organization:
    get:
      tags: [Workspace]
      summary: Get the authenticated user's workspace
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Workspace }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /workspace/teams:
    get:
      tags: [Workspace]
      summary: List teams in the current tenant
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Teams }
    post:
      tags: [Workspace]
      summary: Create a team
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, required: [name], properties: { name: { type: string, minLength: 2, maxLength: 80 } } }
      responses:
        "201": { description: Team created }
        "403": { $ref: "#/components/responses/Forbidden" }
  /workspace/teams/{teamId}:
    delete:
      tags: [Workspace]
      summary: Archive a team in this tenant
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: teamId
          required: true
          schema: { type: string }
      responses:
        "200": { description: Team archived }
        "400": { description: Reassign members before archiving the team }
        "404": { $ref: "#/components/responses/NotFound" }
  /workspace/invitations:
    post:
      tags: [Workspace]
      summary: Create a seven-day, single-use team member invitation
      description: Returns a one-time acceptance token because no outbound email provider is configured. Managers can invite only to their assigned team.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, teamId]
              properties:
                email: { type: string, format: email }
                teamId: { type: string }
      responses:
        "201": { description: Invitation token returned once }
        "403": { $ref: "#/components/responses/Forbidden" }
  /workspace/members:
    get:
      tags: [Workspace]
      summary: List workspace members (business admins see all; managers see their team)
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Tenant members }
        "403": { $ref: "#/components/responses/Forbidden" }
  /workspace/members/{memberId}:
    patch:
      tags: [Workspace]
      summary: Change a tenant member's role or assigned team
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: memberId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                role: { type: string, enum: [admin, manager, employee] }
                teamId: { type: string, nullable: true }
      responses:
        "200": { description: Member updated }
        "404": { $ref: "#/components/responses/NotFound" }
  /users:
    get:
      tags: [Workspace]
      summary: List tenant-scoped users (managers see their assigned team)
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Workspace users; managers see their assigned team only }
    post:
      tags: [Workspace]
      summary: Invite a tenant user to a team
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, teamId]
              properties:
                email: { type: string, format: email }
                teamId: { type: string }
      responses:
        "201": { description: One-time invitation token }
  /users/{userId}:
    patch:
      tags: [Workspace]
      summary: Update user role or team assignment within the tenant
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: userId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, properties: { role: { type: string, enum: [admin, manager, employee] }, teamId: { type: string, nullable: true } } }
      responses:
        "200": { description: User updated }
        "404": { $ref: "#/components/responses/NotFound" }
  /dashboard:
    get:
      tags: [Activity]
      summary: Get only the authenticated user's activity summary
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: range
          schema: { type: string, enum: [today, 7d, 30d], default: today }
      responses:
        "200": { description: Personal dashboard aggregates and session data }
        "403": { $ref: "#/components/responses/Forbidden" }
  /sessions:
    get:
      tags: [Activity]
      summary: Paginated activity history for the authenticated user
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: from
          schema: { type: string, format: date-time }
        - in: query
          name: to
          schema: { type: string, format: date-time }
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        "200": { description: Personal session history and pagination }
    post:
      tags: [Activity]
      summary: Start a personal activity session
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [task, category]
              properties:
                task: { type: string, minLength: 1, maxLength: 120 }
                category: { type: string, enum: [Productive, Neutral, Distracting] }
                startedAt: { type: string, format: date-time }
      responses:
        "201": { description: Activity session created }
  /sessions/start:
    post:
      tags: [Activity]
      summary: Start an activity session
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [task, category]
              properties:
                task: { type: string, minLength: 1, maxLength: 120 }
                category: { type: string, enum: [Productive, Neutral, Distracting] }
      responses:
        "201": { description: Session started }
  /sessions/heartbeat:
    post:
      tags: [Activity]
      summary: Heartbeat a running session by ID
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, required: [sessionId], properties: { sessionId: { type: string } } }
      responses:
        "200": { description: Session heartbeat updated }
        "404": { $ref: "#/components/responses/NotFound" }
  /sessions/{sessionId}/heartbeat:
    post:
      tags: [Activity]
      summary: Heartbeat a running session
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: sessionId
          required: true
          schema: { type: string }
      responses:
        "200": { description: Session heartbeat updated }
        "404": { $ref: "#/components/responses/NotFound" }
  /sessions/{sessionId}/idle:
    post:
      tags: [Activity]
      summary: Mark a running session idle or active
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: sessionId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, required: [idle], properties: { idle: { type: boolean } } }
      responses:
        "200": { description: Idle state updated }
        "404": { $ref: "#/components/responses/NotFound" }
  /sessions/{sessionId}/tags:
    patch:
      tags: [Activity]
      summary: Update activity tags, category, or project/task
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: sessionId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, properties: { tags: { type: array, maxItems: 10, items: { type: string, maxLength: 32 } }, category: { type: string, enum: [Productive, Neutral, Distracting] }, task: { type: string, minLength: 1, maxLength: 120 } } }
      responses:
        "200": { description: Session tags updated }
  /sessions/history:
    get:
      tags: [Activity]
      summary: Paginated activity history for the authenticated user only
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        "200": { description: Personal session history }
  /sessions/summary:
    get:
      tags: [Activity]
      summary: Personal activity summary for a period
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: range
          schema: { type: string, enum: [today, 7d, 30d, quarter], default: 30d }
      responses:
        "200": { description: Personal summary }
  /sessions/{sessionId}/pause:
    post:
      tags: [Activity]
      summary: Pause an activity session
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: sessionId
          required: true
          schema: { type: string }
      responses:
        "200": { description: Session paused }
        "404": { $ref: "#/components/responses/NotFound" }
  /sessions/{sessionId}/resume:
    post:
      tags: [Activity]
      summary: Resume a paused activity session
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: sessionId
          required: true
          schema: { type: string }
      responses:
        "200": { description: Session resumed }
        "404": { $ref: "#/components/responses/NotFound" }
  /sessions/{sessionId}/stop:
    post:
      tags: [Activity]
      summary: Stop a session owned by the authenticated user
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: sessionId
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                activeSeconds: { type: integer, minimum: 0, maximum: 86400 }
                idleSeconds: { type: integer, minimum: 0, maximum: 86400 }
      responses:
        "200": { description: Stopped activity session }
        "404": { $ref: "#/components/responses/NotFound" }
  /calmwork:
    post:
      tags: [Pulse]
      summary: Submit anonymous weekly mood, stress, and workload
      description: Optional comment is accepted but discarded; it is not saved or logged. A separate receipt prevents repeat weekly submissions and contains no response values.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PulseSubmission" }
      responses:
        "201": { description: Anonymous response accepted }
        "409": { $ref: "#/components/responses/Conflict" }
  /pulse/me:
    get:
      tags: [Pulse]
      summary: Check whether this user submitted a pulse this week
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Submission status }
  /pulse/teams:
    get:
      tags: [Pulse]
      summary: Manager-only aggregated team pulse; groups below five are omitted
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: teamId
          schema: { type: string }
      responses:
        "200": { description: Thresholded group aggregates only }
        "403": { $ref: "#/components/responses/Forbidden" }
  /alerts:
    get:
      tags: [Pulse]
      summary: List tenant-scoped aggregated wellbeing alerts
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: status
          schema: { type: string, enum: [open, acknowledged, dismissed] }
      responses:
        "200": { description: Alerts; no individual response data is exposed }
  /alerts/{alertId}:
    get:
      tags: [Pulse]
      summary: Get a single tenant-scoped alert
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: alertId
          required: true
          schema: { type: string }
      responses:
        "200": { description: Aggregated wellbeing alert }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Pulse]
      summary: Acknowledge or dismiss a tenant alert
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: alertId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, required: [status], properties: { status: { type: string, enum: [acknowledged, dismissed] } } }
      responses:
        "200": { description: Updated alert }
        "404": { $ref: "#/components/responses/NotFound" }
  /reports/summary:
    get:
      tags: [Reports]
      summary: Generate a thresholded report for the tenant or manager's assigned team
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: period
          schema: { type: string, enum: [today, 7d, 30d, quarter], default: 30d }
        - in: query
          name: metrics
          schema: { type: string, example: Active time,Productivity,Team pulse }
      responses:
        "200": { description: Summary }
        "403": { $ref: "#/components/responses/Forbidden" }
        "402": { $ref: "#/components/responses/SubscriptionRequired" }
  /reports/preview:
    get:
      tags: [Reports]
      summary: Preview thresholded report data
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: period
          schema: { type: string, enum: [today, 7d, 30d, quarter], default: 30d }
        - in: query
          name: metrics
          schema: { type: string }
      responses:
        "200": { description: Report preview }
        "402": { $ref: "#/components/responses/SubscriptionRequired" }
    post:
      tags: [Reports]
      summary: Preview thresholded report data
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                period: { type: string, enum: [today, 7d, 30d, quarter], default: 30d }
                metrics: { type: array, items: { type: string, enum: [Active time, Productivity, Idle time, Team pulse, Burnout risk] } }
                format: { type: string, enum: [csv, pdf] }
      responses:
        "200": { description: Thresholded report summary }
        "402": { $ref: "#/components/responses/SubscriptionRequired" }
  /reports/generate:
    post:
      tags: [Reports]
      summary: Generate and persist a report for later download
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [period, metrics, format]
              properties:
                period: { type: string, enum: [today, 7d, 30d, quarter] }
                metrics: { type: array, minItems: 1, maxItems: 5, items: { type: string, enum: [Active time, Productivity, Idle time, Team pulse, Burnout risk] } }
                format: { type: string, enum: [csv, pdf] }
      responses:
        "201": { description: Generated report ID and download URL }
        "402": { $ref: "#/components/responses/SubscriptionRequired" }
  /reports/{reportId}:
    get:
      tags: [Reports]
      summary: Download a generated report within the current tenant
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: reportId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Generated report file
          content:
            text/csv: { schema: { type: string } }
            application/pdf: { schema: { type: string, format: binary } }
        "402": { $ref: "#/components/responses/SubscriptionRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
  /reports/export:
    get:
      tags: [Reports]
      summary: Download a CSV or PDF report for active Team or Business subscriptions
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: format
          required: true
          schema: { type: string, enum: [csv, pdf] }
        - in: query
          name: period
          schema: { type: string, enum: [today, 7d, 30d, quarter], default: 30d }
        - in: query
          name: metrics
          schema: { type: string }
      responses:
        "200":
          description: Report file
          content:
            text/csv: { schema: { type: string } }
            application/pdf: { schema: { type: string, format: binary } }
        "403": { $ref: "#/components/responses/Forbidden" }
  /billing/checkout:
    post:
      tags: [Billing]
      summary: Create a Razorpay subscription and return its hosted checkout URL
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, required: [plan, cycle], properties: { plan: { type: string, enum: [Starter, Team, Business] }, cycle: { type: string, enum: [monthly, yearly] } } }
      responses:
        "201": { description: Razorpay hosted checkout URL }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /billing/cancel:
    post:
      tags: [Billing]
      summary: Schedule cancellation at the end of the current billing period
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Cancellation state }
  /billing/subscription:
    get:
      tags: [Billing]
      summary: Get the current workspace subscription
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Plan, status, trial, and renewal state }
  /billing/invoices:
    get:
      tags: [Billing]
      summary: List Razorpay payment invoices for the current workspace
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Customer invoices }
  /billing/plans:
    get:
      tags: [Billing]
      summary: List plans and configured Razorpay billing cycles
      responses:
        "200": { description: Available plans }
  /tools/planner:
    get:
      tags: [Employee tools]
      summary: List the authenticated user's planner tasks
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Tenant- and user-scoped planner tasks }
    post:
      tags: [Employee tools]
      summary: Create a planner task
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
